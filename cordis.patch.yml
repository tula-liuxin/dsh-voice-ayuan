# voice-ayuan：语音通话插件。
# 服务器地址等私有配置请在 profile 的 cordis.patch.yml 里用同名 id 覆盖，
# 不要写进这个公开包。
- insert:
    - id: voice-ayuan
      name: 'voice-ayuan'
      config:
        remote:
          host: 127.0.0.1        # 用 SSH 隧道时填远端主机
          port: 22
          user: your-user
          unit: speech-to-speech.service
          tunnelLocalPort: 18765
          remotePort: 8765
        gateway:
          allowedOrigin: http://127.0.0.1:7969
        # 语音任务投给谁（宿主侧默认值；profile patch 里覆盖）：
        # bridge:
        #   cwdPrefix: C:/path/to/ayuan-workspace  # 只投该工作区的 live 会话；没有就自动新建「语音通话」
        #   autoCreateSession: true                # false = 退回「最近活跃会话」（旧行为）
        #   sessionTitle: 语音通话
